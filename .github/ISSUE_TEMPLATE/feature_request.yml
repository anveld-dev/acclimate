name: Feature request
description: Suggest a change to Acclimate.
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What are you trying to do, and where does the current workflow fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should Acclimate do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Describe any workarounds you use today or other approaches you considered.
