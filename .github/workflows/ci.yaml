name: checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      full: ${{ steps.select.outputs.full }}
      unit: ${{ steps.select.outputs.unit }}
      bdd: ${{ steps.select.outputs.bdd }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tested PR merge commit and its base parent.
          fetch-depth: 2
      - run: python3 -m unittest scripts.ci.test_affected
      - id: select
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci/affected.py
      - name: Verify documentation and generated exports on selective runs
        if: steps.select.outputs.full == 'false'
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-env"
          "$RUNNER_TEMP/docs-env/bin/pip" install -r scripts/docs-requirements.txt
          "$RUNNER_TEMP/docs-env/bin/python" scripts/build_docs.py
          python3 scripts/check_docs.py
          git diff --exit-code -- docs/site
          test -z "$(git ls-files --others --exclude-standard -- docs/site)"
  build:
    needs: changes
    if: needs.changes.outputs.bdd == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - run: cargo build --locked
      - run: npm run build
      - name: Archive the integration builds
        run: |
          tar --zstd -cf "$RUNNER_TEMP/integration-build.tar.zst" \
            target/debug/acclimate-service dist packages/*/dist apps/console/.output
      - uses: actions/upload-artifact@v4
        with:
          name: integration-build
          path: ${{ runner.temp }}/integration-build.tar.zst
          compression-level: 0
          if-no-files-found: error
          overwrite: true
  unit:
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:starters
      - run: npm audit --audit-level=high
      - run: PYTHONPATH=python python -m unittest discover -s python/tests -v
      - run: python -m unittest discover -s scripts/operations -p 'test_*.py' -v
  test:
    needs: [changes, build]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tools
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install -r "$GITHUB_WORKSPACE/scripts/lint-requirements.txt"
          curl --fail --location --retry 3 --output actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          mkdir -p acclimate-lint-bin
          tar -xzf actionlint.tar.gz -C acclimate-lint-bin actionlint
          printf '%s\n' "$RUNNER_TEMP/acclimate-lint-bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - uses: actions/download-artifact@v4
        with:
          name: integration-build
          path: ${{ runner.temp }}
      - run: tar --zstd -xf "$RUNNER_TEMP/integration-build.tar.zst"
      - run: npm run lint
      - name: Install PostgreSQL test binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          /usr/lib/postgresql/16/bin/initdb --version
      - name: Test built console entrypoints
        run: npx --no-install tsx --tsconfig apps/console/tsconfig.json --test apps/console/tests/console-entrypoints.integration.ts
      - run: npm run pack:verify -- --skip-build --console-runtime
      - run: cargo test --locked -p acclimate-executor
      - run: docker info && python executor/tests/sandbox.py -v
      - name: Run the sandbox gate under gVisor
        env:
          ACCLIMATE_SANDBOX_RUNTIME: runsc
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor.gpg
          echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor.gpg] https://storage.googleapis.com/gvisor/releases release main' | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
          sudo jq '.runtimes.runsc = {"path":"runsc","runtimeArgs":["--host-uds=open"]}' /etc/docker/daemon.json > "$RUNNER_TEMP/docker.json"
          sudo install -m 0644 "$RUNNER_TEMP/docker.json" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info
          python executor/tests/sandbox.py -v
      - run: PG_BIN=/usr/lib/postgresql/16/bin python executor/tests/central_learning.py -v
      - run: python scripts/productization/rust_tests.py --pg-bin /usr/lib/postgresql/16/bin
      - run: npm run test:e2e -- --skip-build --pg-bin /usr/lib/postgresql/16/bin
      - run: python -m unittest discover -s scripts/productization -p 'test_external.py' -v
      - run: npm run test:identity:contracts
      - uses: actions/upload-artifact@v4
        with:
          name: installable-local-release
          path: |
            artifacts/releases/
            artifacts/production-only/
          if-no-files-found: error
  behavior-shard:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: integration-build
          path: ${{ runner.temp }}
      - run: tar --zstd -xf "$RUNNER_TEMP/integration-build.tar.zst"
      - name: Install PostgreSQL test binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          /usr/lib/postgresql/16/bin/initdb --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bdd/requirements.txt
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - run: python -m pip install -r scripts/bdd/requirements.txt
      - uses: ./.github/actions/install-browser
      - name: Run behavior shard
        env:
          SHARD: ${{ matrix.shard }}
        run: npm run test:bdd -- --skip-build --shard "$SHARD" 3 --pg-bin /usr/lib/postgresql/16/bin
      - name: Check the read-only console and sign-in protocol
        if: matrix.shard == 3
        run: |
          python scripts/test_console_browser.py --pg-bin /usr/lib/postgresql/16/bin > artifacts/bdd/console-readonly.log &
          readonly_pid=$!
          status=0
          python scripts/testing/console_protocol.py --pg-bin /usr/lib/postgresql/16/bin --report artifacts/production-only/console-protocol.json || status=$?
          wait "$readonly_pid" || status=$?
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior-shard-${{ matrix.shard }}
          path: artifacts/
          if-no-files-found: error
          overwrite: true
  behaviors:
    needs: [changes, behavior-shard]
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.bdd == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require successful check selection
        env:
          RESULT: ${{ needs.changes.result }}
        run: test "$RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: behavior-shard-*
          path: artifacts/shards
      - name: Require every reviewed behavior variant
        run: python3 -m scripts.bdd.coverage --output artifacts/bdd artifacts/shards/behavior-shard-*/bdd/results.json
      - name: Require all shard checks
        env:
          RESULT: ${{ needs.behavior-shard.result }}
        run: test "$RESULT" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior-results
          path: artifacts/bdd/
          overwrite: true
  keycloak:
    needs: [changes, build]
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: integration-build
          path: ${{ runner.temp }}
      - run: tar --zstd -xf "$RUNNER_TEMP/integration-build.tar.zst"
      - name: Install PostgreSQL test binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          /usr/lib/postgresql/16/bin/initdb --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bdd/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - run: python -m pip install -r scripts/bdd/requirements.txt
      - uses: ./.github/actions/install-browser
      - run: npm run build:theme
      - run: npm run test:email -- --pg-bin /usr/lib/postgresql/16/bin --report artifacts/keycloak/email-protocol.json
      - run: python scripts/testing/member_live_updates.py --pg-bin /usr/lib/postgresql/16/bin --report artifacts/keycloak/members-auto.json
      - run: python scripts/testing/fetch_keycloak.py --output /tmp/acclimate-keycloak-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:identity:keycloak -- --email --keycloak-home /tmp/acclimate-keycloak-tools/keycloak-26.8.2 --java-home "$JAVA_HOME" --pg-bin /usr/lib/postgresql/16/bin --report artifacts/keycloak/real-protocol.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keycloak-results
          path: |
            artifacts/keycloak/
            /tmp/acclimate-keycloak-tools/verified-release.json
