name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acclimate
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: acclimate_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U acclimate" --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgres://acclimate:test-only@localhost:5432/acclimate_test
      ACCLIMATE_TEST_DATABASE_URL: postgres://acclimate:test-only@localhost:5432/acclimate_test
      EVALUATION_TEST_DATABASE_URL: postgres://acclimate:test-only@localhost:5432/acclimate_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL test binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          /usr/lib/postgresql/16/bin/initdb --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:console:entrypoints
      - run: npm run pack:verify -- --skip-build --console-runtime
      - run: npm run test:improvement
      - run: npm run test:operator
      - run: npm run test:evaluator
      - run: npm run test:full-roadmap
      - run: npm audit --audit-level=high
      - run: PYTHONPATH=python python -m unittest discover -s python/tests -v
      - run: python scripts/check-python-package.py
      - run: python -m unittest discover -s scripts/operations -p 'test_*.py' -v
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: python scripts/productization/rust_tests.py --pg-bin /usr/lib/postgresql/16/bin
      - run: cargo build
      - run: npm run test:e2e -- --pg-bin /usr/lib/postgresql/16/bin
      - run: npm run qualify:full-roadmap
      - run: pip install -r scripts/docs-requirements.txt
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s scripts/productization -p 'test_external.py' -v
      - run: npm run test:identity:contracts
      - uses: actions/upload-artifact@v4
        with:
          name: installable-local-release
          path: |
            artifacts/releases/
            artifacts/production-only/
          if-no-files-found: error
  behaviors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL test binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          /usr/lib/postgresql/16/bin/initdb --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r scripts/bdd/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:bdd -- --pg-bin /usr/lib/postgresql/16/bin
      - run: python scripts/test_console_browser.py --pg-bin /usr/lib/postgresql/16/bin > artifacts/bdd/console-readonly.log
      - run: python scripts/testing/console_protocol.py --pg-bin /usr/lib/postgresql/16/bin --report artifacts/production-only/console-protocol.json
      - run: npm run test:bdd -- --skip-build --dev-console --pg-bin /usr/lib/postgresql/16/bin --tags @UI-DRAFT-02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior-results
          path: |
            artifacts/bdd/
            artifacts/bdd-dev/
            artifacts/production-only/
  keycloak:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL test binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16
          /usr/lib/postgresql/16/bin/initdb --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r scripts/bdd/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: cargo build --locked
      - run: npm run build
      - run: npm run build:theme
      - run: npm run test:email -- --pg-bin /usr/lib/postgresql/16/bin --report artifacts/keycloak/email-protocol.json
      - run: python scripts/testing/member_live_updates.py --pg-bin /usr/lib/postgresql/16/bin --report artifacts/keycloak/members-auto.json
      - run: python scripts/testing/fetch_keycloak.py --output /tmp/acclimate-keycloak-tools
      - run: npm run test:identity:keycloak -- --email --keycloak-home /tmp/acclimate-keycloak-tools/keycloak-26.8.2 --java-home "$JAVA_HOME" --pg-bin /usr/lib/postgresql/16/bin --report artifacts/keycloak/real-protocol.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keycloak-results
          path: |
            artifacts/keycloak/
            /tmp/acclimate-keycloak-tools/verified-release.json
