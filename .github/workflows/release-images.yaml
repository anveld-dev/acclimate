name: release images
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: boolean
        required: true

jobs:
  images:
    # The caller grants packages: write only for publication.
    # Build each platform on a native runner. Rust under QEMU is slow and can crash rustc.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [acclimate-service, acclimate-console, acclimate-executor, acclimate-runner]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: acclimate-service
            context: .
            dockerfile: deploy/Dockerfile
          - image: acclimate-console
            context: .
            dockerfile: deploy/console.Dockerfile
          # The executor pins the runner's image ID, so both are published at the service version.
          - image: acclimate-executor
            context: .
            dockerfile: executor/Dockerfile
          - image: acclimate-runner
            context: executor/runner
            dockerfile: executor/runner/Dockerfile
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Set image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: printf 'name=ghcr.io/%s/%s\n' "${OWNER,,}" "$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # Publishing pushes an untagged image by digest. The merge job tags the multi-arch index.
          outputs: ${{ inputs.publish && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) || 'type=cacheonly' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
      - name: Record digest
        if: inputs.publish
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.publish
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1
