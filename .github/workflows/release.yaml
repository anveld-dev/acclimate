name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and verify without publishing
        type: boolean
        default: true
      publish-registries:
        description: >-
          Publish the verified npm packages and Python wheel to npm and PyPI instead of
          building images and a GitHub Release. Requires the release tag, dry-run cleared,
          and approval in the npm and pypi environments.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      registries: ${{ steps.version.outputs.registries }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify release version
        id: version
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
          REGISTRIES: ${{ github.event_name == 'workflow_dispatch' && inputs.publish-registries }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          # pack:verify checks the SDK, plugins and wheel share this version.
          sdk = "packages/sdk/package.json"
          version = json.loads(Path(sdk).read_text())["version"]
          if not re.fullmatch(r"(?:0|[1-9][0-9]*)(?:\.(?:0|[1-9][0-9]*)){2}", version):
              raise SystemExit(f"{sdk} must use a major.minor.patch release version")
          versions = {
              path: json.loads(Path(path).read_text())["version"]
              for path in ("package.json", "apps/console/package.json")
          }
          versions["Cargo.toml"] = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          for path, actual in versions.items():
              if actual != version:
                  raise SystemExit(f"{path} version {actual} does not match SDK version {version}")

          publish = os.environ["DRY_RUN"] != "true"
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              if tag != f"v{version}":
                  raise SystemExit(f"Tag {tag} does not match package versions (expected v{version})")
          elif publish:
              raise SystemExit("Publishing requires selecting the matching vMAJOR.MINOR.PATCH tag")
          # Registry publication is never automatic: a maintainer opts in on a manual run.
          registries = os.environ["REGISTRIES"] == "true"
          if registries and not publish:
              raise SystemExit("Publishing to npm and PyPI requires clearing dry-run")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
              print(f"publish={str(publish).lower()}", file=output)
              print(f"registries={str(registries).lower()}", file=output)
          PY
      - run: npm ci --ignore-scripts --prefer-offline --no-audit
      - run: npm run pack:verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acclimate-release-${{ steps.version.outputs.version }}
          path: artifacts/releases/${{ steps.version.outputs.version }}/
          if-no-files-found: error

  images:
    needs: package
    if: needs.package.outputs.registries != 'true'
    # Build each platform on a native runner. Rust under QEMU is slow and can crash rustc.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [acclimate-service, acclimate-console, acclimate-executor, acclimate-runner]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: acclimate-service
            context: .
            dockerfile: deploy/Dockerfile
          - image: acclimate-console
            context: .
            dockerfile: deploy/console.Dockerfile
          # The executor pins the runner's image ID, so both are published at the service version.
          - image: acclimate-executor
            context: .
            dockerfile: executor/Dockerfile
          - image: acclimate-runner
            context: executor/runner
            dockerfile: executor/runner/Dockerfile
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Set image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: printf 'name=ghcr.io/%s/%s\n' "${OWNER,,}" "$IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: needs.package.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build platform image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          # Publishing pushes an untagged image by digest. The merge job tags the multi-arch index.
          outputs: ${{ needs.package.outputs.publish == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', steps.image.outputs.name) || 'type=cacheonly' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.package.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          provenance: mode=max
          sbom: true
      - name: Record digest
        if: needs.package.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.package.outputs.publish == 'true'
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifests:
    needs: [package, images]
    if: needs.package.outputs.publish == 'true' && needs.package.outputs.registries != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [acclimate-service, acclimate-console, acclimate-executor, acclimate-runner]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          name="ghcr.io/${OWNER,,}/$IMAGE"
          digests=(*)
          if [[ ${#digests[@]} -ne 2 ]]; then
            echo "Expected amd64 and arm64 digests, found ${#digests[@]}" >&2
            exit 1
          fi
          sources=()
          for digest in "${digests[@]}"; do
            sources+=("$name@sha256:$digest")
          done
          docker buildx imagetools create --tag "$name:$VERSION" --tag "$name:latest" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
            "${sources[@]}"
          docker buildx imagetools inspect "$name:$VERSION"

  release:
    needs: [package, manifests]
    if: needs.package.outputs.publish == 'true' && needs.package.outputs.registries != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: acclimate-release-${{ needs.package.outputs.version }}
          path: release-assets
      - name: Extract changelog notes
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          changelog = Path("CHANGELOG.md")
          if changelog.is_file():
              version = re.escape(os.environ["RELEASE_VERSION"])
              heading_pattern = rf"(?:\[v?{version}\]|v?{version})(?:[ \t]+-[ \t]+.+)?"
              sections = re.split(r"^##[ \t]+", changelog.read_text(encoding="utf-8"), flags=re.M)
              for section in sections[1:]:
                  heading, _, body = section.partition("\n")
                  if re.fullmatch(heading_pattern, heading.strip()) and body.strip():
                      notes = Path(os.environ["RUNNER_TEMP"]) / "release-notes.md"
                      notes.write_text(body.strip() + "\n", encoding="utf-8")
                      break
          PY
      - name: Verify and publish release attachments
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum --check --strict SHA256SUMS
          release_args=(--generate-notes)
          if [[ -s "$RUNNER_TEMP/release-notes.md" ]]; then
            release_args=(--notes-file "$RUNNER_TEMP/release-notes.md")
          fi
          gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$GITHUB_REF_NAME" "${release_args[@]}"

  # The registry jobs publish the same verified artifacts as the GitHub Release. Each
  # runs in a protected environment, so a maintainer approves the deployment.
  npm:
    needs: package
    if: needs.package.outputs.registries == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/@acclimate/sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.6.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: acclimate-release-${{ needs.package.outputs.version }}
          path: release-assets
      - name: Verify and publish npm packages
        working-directory: release-assets
        env:
          VERSION: ${{ needs.package.outputs.version }}
          # Only needed for a package's first publication. Afterwards, configure npm
          # trusted publishing for this workflow and environment and remove the secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          sha256sum --check --strict SHA256SUMS
          # Publish the SDK before the plugins that depend on it. Skip versions that
          # already exist so a rerun finishes the remaining packages.
          for package in sdk codex-plugin claude-plugin pi-plugin cursor-plugin; do
            if npm view "@acclimate/$package@$VERSION" version >/dev/null 2>&1; then
              echo "@acclimate/$package@$VERSION is already published"
              continue
            fi
            npm publish --provenance --access public "./acclimate-$package-$VERSION.tgz"
          done

  pypi:
    needs: package
    if: needs.package.outputs.registries == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/acclimate-sdk/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: acclimate-release-${{ needs.package.outputs.version }}
          path: release-assets
      - name: Verify the wheel
        env:
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          (cd release-assets && sha256sum --check --strict SHA256SUMS)
          mkdir dist
          cp "release-assets/acclimate_sdk-$VERSION-py3-none-any.whl" dist/
      # Trusted publishing: PyPI accepts this workflow's OIDC identity, so no API token
      # is stored. The action also uploads PEP 740 attestations.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
