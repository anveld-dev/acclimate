# Co-hosted Keycloak. Merge with compose.yaml; existing application volumes are preserved.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"
services:
  keycloak-db:
    image: postgres:16-alpine
    logging: *logging
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD_FILE: /run/secrets/keycloak_postgres_password
    secrets: [keycloak_postgres_password]
    volumes: [keycloak-postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    logging: *logging
    # No image is published. Every up rebuilds it from this checkout, from cache when unchanged,
    # so an upgrade applies the Keycloak version the checkout pins.
    pull_policy: build
    build:
      context: .
      dockerfile: deploy/keycloak/Dockerfile
    command: ["start", "--optimized", "--import-realm"]
    env_file:
      - ${ACCLIMATE_KEYCLOAK_ENV:-${ACCLIMATE_CONFIG_DIR:?Run deploy/init.sh, or set ACCLIMATE_CONFIG_DIR to the private directory}/keycloak.env}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: https://${KEYCLOAK_HOST:?Set KEYCLOAK_HOST to the public identity hostname}
      # The admin console has no public route. Reach it through this loopback-only port.
      KC_HOSTNAME_ADMIN: http://127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8180}
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HTTP_PORT: "8080"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_CACHE: local
    volumes:
      - ./deploy/keycloak/acclimate-realm.json:/opt/keycloak/data/import/acclimate-realm.json:ro
      - ./deploy/keycloak/acclimate-users-0.json:/opt/keycloak/data/import/acclimate-users-0.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_ADMIN_PORT:-8180}:8080"
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks: [backend, outbound]
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/bin/bash", "/opt/keycloak/bin/acclimate-health.sh"]
      interval: 10s
      timeout: 4s
      retries: 24
      start_period: 90s
  proxy:
    environment:
      KEYCLOAK_HOST: ${KEYCLOAK_HOST:?Set KEYCLOAK_HOST to the public identity hostname}
    volumes:
      - ./deploy/keycloak/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      backend:
        # Node uses the public issuer and certificate over the private TLS proxy route.
        aliases:
          - ${KEYCLOAK_HOST:?Set KEYCLOAK_HOST to the public identity hostname}
      edge: {}
volumes:
  keycloak-postgres-data:
secrets:
  keycloak_postgres_password:
    file: ${ACCLIMATE_KEYCLOAK_POSTGRES_PASSWORD_FILE:-${ACCLIMATE_CONFIG_DIR:?Run deploy/init.sh, or set ACCLIMATE_CONFIG_DIR to the private directory}/keycloak-postgres-password}
