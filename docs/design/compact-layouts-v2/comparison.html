<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px}button{font:inherit;font-size:14px;text-align:left;min-height:48px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--foreground);cursor:pointer}button[aria-pressed=true]{outline:2px solid var(--primary);outline-offset:-2px}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}button b{margin-right:4px;color:var(--muted-foreground)}figure{margin:0}.image-wrap{max-height:520px;overflow:auto;border-radius:var(--radius)}.image-wrap.zoomed img{width:1440px;max-width:none}.zoom-control{margin-bottom:8px;min-height:36px;font-size:13px;padding:6px 10px}figure[hidden]{display:none}img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:var(--radius)}figcaption{font-size:13px;line-height:1.5;color:var(--muted-foreground);margin-top:8px}strong{color:var(--foreground)}@media(max-width:480px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><button type="button" class="zoom-control" aria-pressed="false" id="zoom">Enlarge image</button><div class="choices" role="group" aria-label="Fresh layout concepts"><button type="button" data-choice="A" aria-pressed="true" aria-controls="concept-A"><b>A</b> Integrated scope header</button><button type="button" data-choice="B" aria-pressed="false" aria-controls="concept-B"><b>B</b> Full-width application bar</button><button type="button" data-choice="C" aria-pressed="false" aria-controls="concept-C"><b>C</b> One contextual left column</button><button type="button" data-choice="D" aria-pressed="false" aria-controls="concept-D"><b>D</b> Document focus with file picker</button><button type="button" data-choice="E" aria-pressed="false" aria-controls="concept-E"><b>E</b> Optional review inspector</button><button type="button" data-choice="F" aria-pressed="false" aria-controls="concept-F"><b>F</b> Inline file collection</button></div><figure id="concept-A"><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/a.png" alt="Concept A: Integrated scope header"></div><figcaption><strong>A · Integrated scope header</strong> — Keep labeled app navigation; combine bundle identity, channel and view links. Generated concept; exact labels and controls still need implementation review.</figcaption></figure><figure id="concept-B" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/b.png" alt="Concept B: Full-width application bar"></div><figcaption><strong>B · Full-width application bar</strong> — A global app bar gives the workbench the full page width. Generated concept; exact labels and controls still need implementation review.</figcaption></figure><figure id="concept-C" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/c.png" alt="Concept C: One contextual left column"></div><figcaption><strong>C · One contextual left column</strong> — App navigation stays on top; bundle views and files share a clearly grouped local pane. Generated concept; exact labels and controls still need implementation review.</figcaption></figure><figure id="concept-D" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/d.png" alt="Concept D: Document focus with file picker"></div><figcaption><strong>D · Document focus with file picker</strong> — The selected document gets the width; file selection is on demand. Generated concept; exact labels and controls still need implementation review.</figcaption></figure><figure id="concept-E" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/e.png" alt="Concept E: Optional review inspector"></div><figcaption><strong>E · Optional review inspector</strong> — A closable inspector tests side-by-side editing and review. Generated concept; exact labels and controls still need implementation review.</figcaption></figure><figure id="concept-F" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/f.png" alt="Concept F: Inline file collection"></div><figcaption><strong>F · Inline file collection</strong> — A compact collection opens one file inline rather than maintaining separate panes. Generated concept; exact labels and controls still need implementation review.</figcaption></figure><script>document.getElementById("zoom").addEventListener("click",event=>{const enabled=event.currentTarget.getAttribute("aria-pressed")!=="true";event.currentTarget.setAttribute("aria-pressed",String(enabled));event.currentTarget.textContent=enabled?"Fit image":"Enlarge image";document.querySelectorAll(".image-wrap").forEach(el=>el.classList.toggle("zoomed",enabled));});document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('figure').forEach(f=>f.hidden=f.id!=='concept-'+button.dataset.choice)}));</script></body></html>
