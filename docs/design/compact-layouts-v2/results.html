<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}.views{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}button{font:inherit;font-size:14px;padding:8px 12px;min-height:40px;border:1px solid var(--border);border-radius:var(--radius);color:var(--foreground);background:var(--card);cursor:pointer}button[aria-pressed=true]{background:var(--secondary);outline:2px solid var(--ring);outline-offset:-2px}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}.version{margin-left:auto;display:flex;gap:6px}figure{margin:0}.image-wrap{max-height:490px;overflow:auto}figure[data-key=phone] img{width:min(390px,100%);max-height:none}figure[hidden]{display:none}img{display:block;width:100%;height:auto;max-height:490px;object-fit:contain;object-position:top left;border:1px solid var(--border);border-radius:var(--radius)}figcaption{font-size:13px;margin:7px 0 12px;color:var(--muted-foreground)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:12px}.metric strong{font-size:14px}.metric>div{display:grid;grid-template-columns:40px minmax(0,1fr) 42px;align-items:center;gap:7px;font-size:13px;margin-top:5px}.metric span{width:40px;flex-shrink:0;color:var(--muted-foreground)}.metric b{font-weight:500}.metric i{height:10px;display:block;border-radius:3px;flex-shrink:0}.old{background:var(--muted-foreground);opacity:.6}.new{background:var(--chart-1)}.measure-note{font-size:13px;color:var(--muted-foreground);margin:8px 0 0}@media(max-width:420px){.views{gap:4px}button{font-size:13px;padding:7px 9px}.version{margin-left:0}.metrics{gap:12px}}</style></head><body><div class="views" role="group" aria-label="Rendered viewport"><button type="button" data-view="desktop" aria-pressed="true">Desktop</button><button type="button" data-view="phone" aria-pressed="false">Phone</button><button type="button" data-view="zoom" aria-pressed="false">200% zoom</button><button type="button" data-view="evidence" aria-pressed="false">Evidence</button><div class="version" role="group" aria-label="Compare version"><button type="button" data-version="before" aria-pressed="false">Before</button><button type="button" data-version="implemented" aria-pressed="true">Now</button></div></div><figure data-key="desktop" data-version="before" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/before-desktop.png" alt="before Desktop Acclimate layout"></div><figcaption>Desktop · Previous shadcn layout · Real persisted test fixture.</figcaption></figure><figure data-key="desktop" data-version="implemented"><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/implemented-desktop.png" alt="implemented Desktop Acclimate layout"></div><figcaption>Desktop · Current implementation · Real persisted test fixture.</figcaption></figure><figure data-key="phone" data-version="before" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/before-phone.png" alt="before Phone Acclimate layout"></div><figcaption>Phone · Previous shadcn layout · Real persisted test fixture.</figcaption></figure><figure data-key="phone" data-version="implemented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/implemented-phone.png" alt="implemented Phone Acclimate layout"></div><figcaption>Phone · Current implementation · Real persisted test fixture.</figcaption></figure><figure data-key="zoom" data-version="before" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/before-zoom.png" alt="before 200% zoom Acclimate layout"></div><figcaption>200% zoom · Previous shadcn layout · Real persisted test fixture.</figcaption></figure><figure data-key="zoom" data-version="implemented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/implemented-zoom.png" alt="implemented 200% zoom Acclimate layout"></div><figcaption>200% zoom · Current implementation · Real persisted test fixture.</figcaption></figure><figure data-key="evidence" data-version="before" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/before-evidence.png" alt="before Evidence Acclimate layout"></div><figcaption>Evidence · Previous shadcn layout · Real persisted test fixture.</figcaption></figure><figure data-key="evidence" data-version="implemented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v2/images/implemented-evidence.png" alt="implemented Evidence Acclimate layout"></div><figcaption>Evidence · Current implementation · Real persisted test fixture.</figcaption></figure><div class="metrics" aria-label="Editor distance from viewport top"><div class="metric"><strong>Desktop</strong><div><span>Before</span><i class="old" style="width:50.40%"></i><b>252px</b></div><div><span>Now</span><i class="new" style="width:31.20%"></i><b>156px</b></div></div><div class="metric"><strong>390px phone</strong><div><span>Before</span><i class="old" style="width:88.80%"></i><b>444px</b></div><div><span>Now</span><i class="new" style="width:66.68%"></i><b>333px</b></div></div></div><p class="measure-note">Editor distance from the top of the viewport. Lower is better; text and touch targets stay readable.</p><script>let view='desktop',version='implemented';const update=()=>{document.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelectorAll('button[data-version]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.version===version)));document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.key!==view||f.dataset.version!==version)};document.querySelectorAll('button[data-view]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.view;update()}));document.querySelectorAll('button[data-version]').forEach(b=>b.addEventListener('click',()=>{version=b.dataset.version;update()}));</script></body></html>
