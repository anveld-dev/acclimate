<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}.choices{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}button{font:inherit;font-size:14px;min-height:44px;padding:8px 10px;background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}button[aria-pressed=true]{outline:2px solid var(--primary);outline-offset:-2px}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}figure{margin:0}figure[hidden]{display:none}.image-wrap{max-height:520px;overflow:auto;border-radius:var(--radius)}img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:var(--radius)}.image-wrap.zoomed img{width:1440px;max-width:none}figcaption,p{font-size:14px;line-height:1.5;color:var(--muted-foreground);margin:8px 0 0}button:disabled{opacity:.5;cursor:default}</style></head><body><div class="choices" role="group" aria-label="Actual pages"><button type="button" data-view="review" aria-pressed="true">Review · desktop</button><button type="button" data-view="phone" aria-pressed="false">Review · phone</button><button type="button" data-view="zoom" aria-pressed="false">Review · 200%</button><button type="button" data-view="setup" aria-pressed="false">App setup · desktop</button><button type="button" data-view="setup-phone" aria-pressed="false">App setup · phone</button><button type="button" data-view="setup-zoom" aria-pressed="false">App setup · 200%</button><button type="button" data-view="first" aria-pressed="false">First evaluation</button><button type="button" data-view="requested" aria-pressed="false">Requested</button><button type="button" data-view="running" aria-pressed="false">Running</button></div><div class="choices" role="group" aria-label="Version"><button type="button" data-version="before" aria-pressed="false">Before</button><button type="button" data-version="implemented" aria-pressed="true">Implemented</button><button type="button" id="zoom" aria-pressed="false">Enlarge image</button></div><figure data-key="review" data-version="implemented"><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/implemented-review.png" alt="Review · desktop, implemented"></div><figcaption>Review · desktop · Implemented · Real persisted test fixture.</figcaption></figure><figure data-key="review" data-version="before" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/before-review.png" alt="Review · desktop, before"></div><figcaption>Review · desktop · Before · Real persisted test fixture.</figcaption></figure><figure data-key="phone" data-version="implemented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/implemented-phone.png" alt="Review · phone, implemented"></div><figcaption>Review · phone · Implemented · Real persisted test fixture.</figcaption></figure><figure data-key="phone" data-version="before" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/before-phone.png" alt="Review · phone, before"></div><figcaption>Review · phone · Before · Real persisted test fixture.</figcaption></figure><figure data-key="zoom" data-version="implemented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/implemented-zoom.png" alt="Review · 200%, implemented"></div><figcaption>Review · 200% · Implemented · Real persisted test fixture.</figcaption></figure><figure data-key="zoom" data-version="before" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/before-zoom.png" alt="Review · 200%, before"></div><figcaption>Review · 200% · Before · Real persisted test fixture.</figcaption></figure><figure data-key="setup" data-version="implemented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/implemented-setup.png" alt="App setup · desktop, implemented"></div><figcaption>App setup · desktop · Implemented · Real persisted test fixture.</figcaption></figure><figure data-key="setup" data-version="before" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/before-setup.png" alt="App setup · desktop, before"></div><figcaption>App setup · desktop · Before · Real persisted test fixture.</figcaption></figure><figure data-key="setup-phone" data-version="implemented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/implemented-setup-phone.png" alt="App setup · phone, implemented"></div><figcaption>App setup · phone · Implemented · Real persisted test fixture.</figcaption></figure><figure data-key="setup-phone" data-version="before" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/before-setup-phone.png" alt="App setup · phone, before"></div><figcaption>App setup · phone · Before · Real persisted test fixture.</figcaption></figure><figure data-key="setup-zoom" data-version="implemented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/implemented-setup-zoom.png" alt="App setup · 200%, implemented"></div><figcaption>App setup · 200% · Implemented · Real persisted test fixture.</figcaption></figure><figure data-key="setup-zoom" data-version="before" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/before-setup-zoom.png" alt="App setup · 200%, before"></div><figcaption>App setup · 200% · Before · Real persisted test fixture.</figcaption></figure><figure data-key="first" data-version="implemented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/implemented-first.png" alt="First evaluation, implemented"></div><figcaption>First evaluation · Implemented · Real persisted test fixture.</figcaption></figure><figure data-key="requested" data-version="implemented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/implemented-requested.png" alt="Requested, implemented"></div><figcaption>Requested · Implemented · Real persisted test fixture.</figcaption></figure><figure data-key="running" data-version="implemented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v3/images/implemented-running.png" alt="Running, implemented"></div><figcaption>Running · Implemented · Real persisted test fixture.</figcaption></figure><p>Reported evidence stays separate from release approval. Setup uses real SDK commands. Native 200% uses Chrome’s actual zoom setting.</p><script>let view='review',version='implemented';const update=()=>{if(!document.querySelector(`figure[data-key="${view}"][data-version="${version}"]`))version='implemented';document.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelectorAll('button[data-version]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.version===version));b.disabled=b.dataset.version==='before'&&!document.querySelector(`figure[data-key="${view}"][data-version="before"]`)});document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.key!==view||f.dataset.version!==version)};document.querySelectorAll('button[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;update()});document.querySelectorAll('button[data-version]').forEach(b=>b.onclick=()=>{version=b.dataset.version;update()});document.querySelector('#zoom').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'Fit image':'Enlarge image';document.querySelectorAll('.image-wrap').forEach(el=>el.classList.toggle('zoomed',on))};update();</script></body></html>
