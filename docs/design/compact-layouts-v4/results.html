<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}.choices{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}button{font:inherit;font-size:14px;min-height:44px;padding:8px 10px;background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}button[aria-pressed=true]{outline:2px solid var(--primary);outline-offset:-2px}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}figure{margin:0}figure[hidden]{display:none}.image-wrap{max-height:520px;overflow:auto;border-radius:var(--radius)}img{display:block;width:auto;max-width:100%;margin-inline:auto;height:auto;border:1px solid var(--border);border-radius:var(--radius)}.image-wrap.zoomed img{width:1440px;max-width:none}figcaption,p{font-size:14px;line-height:1.5;color:var(--muted-foreground);margin:8px 0 0}button:disabled{opacity:.5;cursor:default}</style></head><body><div class="choices" role="group" aria-label="Actual pages"><button type="button" data-view="review" aria-pressed="false">Draft · desktop</button><button type="button" data-view="phone" aria-pressed="true">Draft · phone</button><button type="button" data-view="zoom" aria-pressed="false">Draft · 200%</button><button type="button" data-view="setup" aria-pressed="false">Published · desktop</button><button type="button" data-view="setup-phone" aria-pressed="false">Published · phone</button><button type="button" data-view="setup-zoom" aria-pressed="false">Published · 200%</button></div><div class="choices" role="group" aria-label="Version"><button type="button" data-version="before" aria-pressed="false">Before</button><button type="button" data-version="implemented" aria-pressed="true">Implemented</button><button type="button" id="zoom" aria-pressed="false">Enlarge image</button></div><figure data-key="review" dat emented" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v4/images/implemented-setup-zoom.png" alt="Published · 200%, implemented"></div><figcaption>Published · 200% · Implemented · Real persisted test fixture.</figcaption></figure><figure data-key="setup-zoom" data-version="before" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Rendered layout"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v4/images/before-setup-zoom.png" alt="Published · 200%, before"></div><figcaption>Published · 200% · Before · Real persisted test fixture.</figcaption></figure><p>Draft actions stay separate from file actions. Text and touch targets stay readable; native 200% uses Chrome’s actual zoom setting.</p><script>let view='phone',version='implemented';const update=()=>{if(!document.querySelector(`figure[data-key="${view}"][data-version="${version}"]`))version='implemented';document.querySelectorAll('button[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelectorAll('button[data-version]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.version===version));b.disabled=b.dataset.version==='before'&&!document.querySelector(`figure[data-key="${view}"][data-version="before"]`)});document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.key!==view||f.dataset.version!==version)};document.querySelectorAll('button[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;update()});document.querySelectorAll('button[data-version]').forEach(b=>b.onclick=()=>{version=b.dataset.version;update()});document.querySelector('#zoom').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'Fit image':'Enlarge image';document.querySelectorAll('.image-wrap').forEach(el=>el.classList.toggle('zoomed',on))};update();</script></body></html>
