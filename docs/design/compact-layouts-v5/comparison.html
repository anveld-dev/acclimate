<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px}button{font:inherit;font-size:14px;text-align:left;min-height:48px;padding:10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card);color:var(--foreground);cursor:pointer}button[aria-pressed=true]{outline:2px solid var(--primary);outline-offset:-2px}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}button b{margin-right:4px;color:var(--muted-foreground)}figure{margin:0}.image-wrap{max-height:520px;overflow:auto;border-radius:var(--radius)}.image-wrap.zoomed img{width:1440px;max-width:none}.zoom-control{margin-bottom:8px;min-height:36px;font-size:13px;padding:6px 10px}figure[hidden]{display:none}img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:var(--radius)}figcaption{font-size:13px;line-height:1.5;color:var(--muted-foreground);margin-top:8px}strong{color:var(--foreground)}@media(max-width:480px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head><body><button type="button" id="zoom" class="zoom-control" aria-pressed="false">Enlarge image</button><div class="choices" role="group" aria-label="Interaction-system concepts"><button type="button" data-choice="A" aria-pressed="true" aria-controls="concept-A"><b>A</b> Quiet compact dialogs</button><button type="button" data-choice="B" aria-pressed="false" aria-controls="concept-B"><b>B</b> Context-preserving drawers</button><button type="button" data-choice="C" aria-pressed="false" aria-controls="concept-C"><b>C</b> Inline editing, explicit decisions</button><button type="button" data-choice="D" aria-pressed="false" aria-controls="concept-D"><b>D</b> Bounded task sheets</button><button type="button" data-choice="E" aria-pressed="false" aria-controls="concept-E"><b>E</b> Progressive detail document</button><button type="button" data-choice="F" aria-pressed="false" aria-controls="concept-F"><b>F</b> Consistent commands and decisions</button></div><figure id="concept-A"><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v5/images/a.png" alt="Generated concept A: Quiet compact dialogs"></div><figcaption><strong>Quiet compact dialogs</strong> · Generated exploration. Labels, status and code still need implementation review.</figcaption></figure><figure id="concept-B" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v5/images/b.png" alt="Generated concept B: Context-preserving drawers"></div><figcaption><strong>Context-preserving drawers</strong> · Generated exploration. Labels, status and code still need implementation review.</figcaption></figure><figure id="concept-C" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v5/images/c.png" alt="Generated concept C: Inline editing, explicit decisions"></div><figcaption><strong>Inline editing, explicit decisions</strong> · Generated exploration. Labels, status and code still need implementation review.</figcaption></figure><figure id="concept-D" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v5/images/d.png" alt="Generated concept D: Bounded task sheets"></div><figcaption><strong>Bounded task sheets</strong> · Generated exploration. Labels, status and code still need implementation review.</figcaption></figure><figure id="concept-E" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v5/images/e.png" alt="Generated concept E: Progressive detail document"></div><figcaption><strong>Progressive detail document</strong> · Generated exploration. Labels, status and code still need implementation review.</figcaption></figure><figure id="concept-F" hidden><div class="image-wrap" tabindex="0" role="region" aria-label="Layout image"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts-v5/images/f.png" alt="Generated concept F: Consistent commands and decisions"></div><figcaption><strong>Consistent commands and decisions</strong> · Generated exploration. Labels, status and code still need implementation review.</figcaption></figure><script>document.getElementById('zoom').addEventListener('click',event=>{const enabled=event.currentTarget.getAttribute('aria-pressed')!=='true';event.currentTarget.setAttribute('aria-pressed',String(enabled));event.currentTarget.textContent=enabled?'Fit image':'Enlarge image';document.querySelectorAll('.image-wrap').forEach(el=>el.classList.toggle('zoomed',enabled));});document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('figure').forEach(f=>f.hidden=f.id!=='concept-'+button.dataset.choice)}));</script></body></html>
