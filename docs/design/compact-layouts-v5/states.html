, "label": "Workspace \u00b7 visible ID rules", "family": "Forms", "devices": ["desktop", "mobile320", "mobile390", "native200"]}, {"key": "preview", "label": "Bundle creation \u00b7 validated preview", "family": "Forms", "devices": ["desktop"]}, {"key": "recovery", "label": "Unconfirmed creation \u00b7 retained body", "family": "Recovery", "devices": ["desktop"]}, {"key": "forgotten", "label": "Unconfirmed creation \u00b7 forgotten body", "family": "Recovery", "devices": ["desktop"]}, {"key": "sdk", "label": "SDK \u00b7 expanded private settings", "family": "Disclosures", "devices": ["desktop", "mobile390"]}, {"key": "version", "label": "Version \u00b7 expanded files", "family": "Forms", "devices": ["desktop", "mobile390"]}];const stateSelect=document.querySelector('#state'),deviceSelect=document.querySelector('#device');let state='entry',device='mobile390',version='implemented';const labels={desktop:'Desktop',mobile320:'320px touch',mobile390:'390px touch',native200:'Native 200%',"native-short":'200% · short window',hover:'Pointer hover',keyboard:'Keyboard focus'};for(const family of [...new Set(states.map(s=>s.family))]){const group=document.createElement('optgroup');group.label=family;for(const s of states.filter(s=>s.family===family)){const o=document.createElement('option');o.value=s.key;o.textContent=s.label;group.append(o)}stateSelect.append(group)}function update(){stateSelect.value=state;const s=states.find(s=>s.key===state);if(!s.devices.includes(device))device=s.devices[0];deviceSelect.replaceChildren(...s.devices.map(d=>{const o=document.createElement('option');o.value=d;o.textContent=labels[d]||d;return o}));deviceSelect.value=device;const exists=v=>document.querySelector(`figure[data-state="${state}"][data-device="${device}"][data-version="${v}"]`);if(!exists(version))version='implemented';document.querySelectorAll('button[data-version]').forEach(b=>{b.disabled=!exists(b.dataset.version);b.setAttribute('aria-pressed',String(b.dataset.version===version))});document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.state!==state||f.dataset.device!==device||f.dataset.version!==version)}stateSelect.onchange=e=>{state=e.target.value;update()};deviceSelect.onchange=e=>{device=e.target.value;update()};document.querySelectorAll('button[data-version]').forEach(b=>b.onclick=()=>{version=b.dataset.version;update()});document.querySelector('#zoom').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'Fit image':'Enlarge image';document.querySelectorAll('.image-wrap').forEach(el=>el.classList.toggle('zoomed',on))};update();</script></body></html>
