<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 12px}.choices button{font:inherit;text-align:left;border:1px solid var(--border);background:var(--card);color:var(--foreground);border-radius:var(--radius);padding:10px;cursor:pointer;min-height:48px;font-size:13px}.choices button[aria-pressed=true]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}.key{font-weight:700;margin-right:5px;color:var(--muted-foreground)}figure{margin:0}figure[hidden]{display:none}.image{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:var(--radius)}figcaption{font-size:13px;color:var(--muted-foreground);margin-top:8px;line-height:1.5}.label{font-weight:600;color:var(--foreground)}@media(max-width:450px){.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.choices button{font-size:12px}}
</style></head><body><div class="choices" aria-label="Layout concepts"><button type="button" data-choice="A" aria-pressed="true" aria-controls="concept-A"><span class="key">A</span>Unified editor</button><button type="button" data-choice="B" aria-pressed="false" aria-controls="concept-B"><span class="key">B</span>Top navigation</button><button type="button" data-choice="C" aria-pressed="false" aria-controls="concept-C"><span class="key">C</span>Document focus</button><button type="button" data-choice="D" aria-pressed="false" aria-controls="concept-D"><span class="key">D</span>Review inspector</button><button type="button" data-choice="E" aria-pressed="false" aria-controls="concept-E"><span class="key">E</span>Combined navigation</button><button type="button" data-choice="F" aria-pressed="false" aria-controls="concept-F"><span class="key">F</span>Collapsible workbench</button></div><figure id="concept-A"><img class="image" src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts/images/a.png" alt="Generated compact Acclimate layout A: Unified editor"><figcaption><span class="label">A · Unified editor.</span> Clear hierarchy with a persistent file navigator. Imagegen exploration; the implementation can combine useful parts.</figcaption></figure><figure id="concept-B" hidden><img class="image" src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts/images/b.png" alt="Generated compact Acclimate layout B: Top navigation"><figcaption><span class="label">B · Top navigation.</span> More editor width from horizontal app navigation. Imagegen exploration; the implementation can combine useful parts.</figcaption></figure><figure id="concept-C" hidden><img class="image" src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts/images/c.png" alt="Generated compact Acclimate layout C: Document focus"><figcaption><span class="label">C · Document focus.</span> Document focus with an on-demand file picker. Imagegen exploration; the implementation can combine useful parts.</figcaption></figure><figure id="concept-D" hidden><img class="image" src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts/images/d.png" alt="Generated compact Acclimate layout D: Review inspector"><figcaption><span class="label">D · Review inspector.</span> Draft actions and history in a side inspector. Imagegen exploration; the implementation can combine useful parts.</figcaption></figure><figure id="concept-E" hidden><img class="image" src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts/images/e.png" alt="Generated compact Acclimate layout E: Combined navigation"><figcaption><span class="label">E · Combined navigation.</span> App and file navigation share a single panel. Imagegen exploration; the implementation can combine useful parts.</figcaption></figure><figure id="concept-F" hidden><img class="image" src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts/images/f.png" alt="Generated compact Acclimate layout F: Collapsible workbench"><figcaption><span class="label">F · Collapsible workbench.</span> A compact workbench with secondary footer controls. Imagegen exploration; the implementation can combine useful parts.</figcaption></figure><script>document.querySelectorAll('[data-choice]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('figure').forEach(f=>f.hidden=f.id!=='concept-'+button.dataset.choice)}));</script></body></html>
