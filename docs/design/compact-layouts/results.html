<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);color:var(--foreground);font-size:14px}.summary{margin:0 0 10px;line-height:1.5}.summary strong{font-weight:650}.chart{display:grid;gap:6px;margin:0 0 14px}.bar{display:grid;grid-template-columns:68px 1fr 58px;gap:10px;align-items:center;font-size:12px;color:var(--muted-foreground)}.track{height:8px;background:var(--muted);border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--muted-foreground);border-radius:4px}.fill.after{background:var(--primary)}.bar output{text-align:right;font-variant-numeric:tabular-nums}.choices{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}button{font:inherit;font-size:13px;min-height:36px;padding:6px 12px;background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer}button[aria-pressed=true]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}figure{margin:0}figure[hidden]{display:none}.frame{aspect-ratio:1.6;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius)}.frame img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}.frame.phone{height:600px;aspect-ratio:auto}.frame.phone img,.frame.zoom img{object-fit:contain;object-position:top center}figcaption{font-size:12px;color:var(--muted-foreground);line-height:1.5;margin-top:8px}
</style></head><body><p class="summary"><strong>252px to the editor</strong> · 966 × 608px editing surface at 1440 × 900.</p><div class="chart" role="img" aria-label="Space before the editor: original approximately655pixels; implemented252pixels."><div class="bar"><span>Before</span><div class="track"><div class="fill" style="width:93.57%"></div></div><output>≈655px</output></div><div class="bar"><span>After</span><div class="track"><div class="fill after" style="width:36%"></div></div><output>252px</output></div></div><div class="choices" aria-label="Compare implementation views"><button data-view="after" aria-pressed="true" aria-controls="view-after">Implemented desktop</button><button data-view="before" aria-pressed="false" aria-controls="view-before">Original screen</button><button data-view="phone" aria-pressed="false" aria-controls="view-phone">Phone</button><button data-view="zoom" aria-pressed="false" aria-controls="view-zoom">200% zoom</button></div><figure id="view-after"><div class="frame after"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts/images/implemented-desktop.png" alt="Implemented desktop of Acclimate"></div><figcaption>Actual console with persisted disposable fixture data. Source editing, saved-generation actions and navigation remain functional.</figcaption></figure><figure id="view-before" hidden><div class="frame before"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts/images/before.png" alt="Original screen of Acclimate"></div><figcaption>User-supplied reference, shown at the same desktop viewport crop.</figcaption></figure><figure id="view-phone" hidden><div class="frame phone"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts/images/implemented-mobile.png" alt="Phone of Acclimate"></div><figcaption>Actual console with persisted disposable fixture data. Source editing, saved-generation actions and navigation remain functional.</figcaption></figure><figure id="view-zoom" hidden><div class="frame zoom"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/compact-layouts/images/implemented-zoom.png" alt="200% zoom of Acclimate"></div><figcaption>Actual console with persisted disposable fixture data. Source editing, saved-generation actions and navigation remain functional.</figcaption></figure><script>document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('figure').forEach(f=>f.hidden=f.id!=='view-'+button.dataset.view)}));</script></body></html>
