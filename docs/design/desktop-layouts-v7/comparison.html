<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acclimate desktop layout alternatives</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f4;color:#242826;font:15px/1.5 system-ui,sans-serif}header,main{max-width:1600px;margin:auto;padding:24px}h1{margin:0;font-size:26px;letter-spacing:-.7px}header p{max-width:75ch;color:#5d635e;margin:8px 0 0}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0;min-width:0}figure button{width:100%;padding:0;border:1px solid #d6dbd1;border-radius:8px;background:white;cursor:zoom-in;overflow:hidden}img{display:block;width:100%;height:auto}figcaption{padding:10px 0}figcaption p{margin:4px 0;color:#5d635e}button:focus-visible{outline:3px solid #7c875d;outline-offset:3px}dialog{width:calc(100% - 32px);max-width:1600px;max-height:900px;padding:14px;border:1px solid #d6dbd1;border-radius:8px}dialog::backdrop{background:#17201bcc}dialog button{display:block;margin:0 0 10px auto;padding:7px 14px;font:inherit;background:white;border:1px solid #ccc;border-radius:6px}@media(max-width:600px){main{grid-template-columns:1fr;padding:16px}}</style><header><h1>Six ways to handle real desktop content</h1><p>Fresh imagegen concepts using the same long bundle name, channel and unsaved draft. They are layout studies; generated paths and labels are not implementation facts. Open any concept at full size.</p></header><main><figure><button data-concept="A" aria-label="Enlarge concept A"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v7/images/a.png" alt="Concept A Identity-first two rows"></button><figcaption><strong>A · Identity-first two rows</strong><p>Wide identity row; honest wrapping.</p></figcaption></figure><figure><button data-concept="B" aria-label="Enlarge concept B"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v7/images/b.png" alt="Concept B Balanced scope columns"></button><figcaption><strong>B · Balanced scope columns</strong><p>Balances title and channel, but reserves a large channel column.</p></figcaption></figure><figure><button data-concept="C" aria-label="Enlarge concept C"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v7/images/c.png" alt="Concept C Full-width title and slim context strip"></button><figcaption><strong>C · Full-width title and slim context strip</strong><p>Wide title, then channel and views; keep actual text size.</p></figcaption></figure><figure><button data-concept="D" aria-label="Enlarge concept D"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v7/images/d.png" alt="Concept D One contextual left column"></button><figcaption><strong>D · One contextual left column</strong><p>Moves bundle scope above files in one left column.</p></figcaption></figure><figure><button data-concept="E" aria-label="Enlarge concept E"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v7/images/e.png" alt="Concept E Wrapped channel selector"></button><figcaption><strong>E · Wrapped channel selector</strong><p>Wraps the selected channel; requires a different picker.</p></figcaption></figure><figure><button data-concept="F" aria-label="Enlarge concept F"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v7/images/f.png" alt="Concept F Content-first bottom draft bar"></button><figcaption><strong>F · Content-first bottom draft bar</strong><p>Moves whole-draft status and actions to the bottom.</p></figcaption></figure></main><dialog aria-label="Full-size design"><button autofocus>Close</button><img alt=""></dialog><script>const d=document.querySelector('dialog'),i=d.querySelector('img');document.querySelectorAll('[data-concept]').forEach(b=>b.addEventListener('click',()=>{i.src=b.querySelector('img').src;i.alt=b.querySelector('img').alt;d.showModal()}));d.querySelector('button').addEventListener('click',()=>d.close());</script></html>
