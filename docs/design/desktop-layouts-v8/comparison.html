<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acclimate · broader desktop explorations</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f4;color:#242826;font:15px/1.5 system-ui,sans-serif}header,main{max-width:1600px;margin:auto;padding:24px}h1{margin:0;font-size:26px;letter-spacing:-.6px}header p{max-width:78ch;color:#5d635e;margin:8px 0 0}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{margin:0;min-width:0}figure button{width:100%;padding:0;border:1px solid #d6dbd1;border-radius:8px;background:white;cursor:zoom-in;overflow:hidden}img{display:block;width:100%;height:auto}figcaption{padding:10px 0}figcaption p{margin:4px 0;color:#5d635e}button:focus-visible{outline:3px solid #7c875d;outline-offset:3px}dialog{width:calc(100% - 32px);max-width:1600px;max-height:900px;padding:14px;border:1px solid #d6dbd1;border-radius:8px}dialog::backdrop{background:#17201bcc}dialog button{display:block;margin:0 0 10px auto;padding:7px 14px;font:inherit;background:white;border:1px solid #ccc;border-radius:6px}@media(max-width:600px){main{grid-template-columns:1fr;padding:16px}}</style><header><h1>Useful pieces, not a forced winner</h1><p>Library, editor and review explorations. These are generated sketches, with known copy and behavior errors. The team challenged the parts independently; no whole screen is an implementation contract.</p></header><main><figure><button data-concept="A" aria-label="Enlarge concept A"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v8/images/a.png" alt="Library concept A Bounded bundle directory"></button><figcaption><strong>A · Bounded bundle directory</strong><p>Borrow: a bounded working zone; keep exact channel navigation.</p></figcaption></figure><figure><button data-concept="B" aria-label="Enlarge concept B"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v8/images/b.png" alt="Library concept B Bundle browser and context pane"></button><figcaption><strong>B · Bundle browser and context pane</strong><p>Reject: selection repeats the same facts and adds a second Open action.</p></figcaption></figure><figure><button data-concept="C" aria-label="Enlarge concept C"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v8/images/c.png" alt="Editor concept C Editor with focused utility dialog"></button><figcaption><strong>C · Editor with focused utility dialog</strong><p>Borrow the focused dialog. Reject overwrite copy: real path collisions reject the batch.</p></figcaption></figure><figure><button data-concept="D" aria-label="Enlarge concept D"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v8/images/d.png" alt="Editor concept D Source-first workspace with file popover"></button><figcaption><strong>D · Source-first workspace with file popover</strong><p>Reject: hiding a frequent file finder costs reopening and obscures source.</p></figcaption></figure><figure><button data-concept="E" aria-label="Enlarge concept E"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v8/images/e.png" alt="Review concept E Evidence workspace and decision context"></button><figcaption><strong>E · Evidence workspace and decision context</strong><p>Reject the sidecar: it narrows paired results and duplicates facts.</p></figcaption></figure><figure><button data-concept="F" aria-label="Enlarge concept F"><img src="/Users/benjaminarmstrong/.t3/worktrees/acclimate/t3-8c855076/docs/design/desktop-layouts-v8/images/f.png" alt="Review concept F Paired evidence with a compact summary"></button><figcaption><strong>F · Paired evidence with a compact summary</strong><p>Borrow compact paired geometry. Reject incorrect “Complete inventory” and success styling.</p></figcaption></figure></main><dialog aria-label="Full-size concept"><button autofocus>Close</button><img alt=""></dialog><script>const d=document.querySelector('dialog'),i=d.querySelector('img');document.querySelectorAll('[data-concept]').forEach(b=>b.addEventListener('click',()=>{i.src=b.querySelector('img').src;i.alt=b.querySelector('img').alt;d.showModal()}));d.querySelector('button').addEventListener('click',()=>d.close());</script></html>
