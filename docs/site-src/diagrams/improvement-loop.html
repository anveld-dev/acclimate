<figure class="diagram" aria-labelledby="improve-caption"><figcaption id="improve-caption">Propose in the service, compare in the app, publish after review.</figcaption>
<ol class="dg-flow dg-four"><li><p class="dg-tag">Service</p><b>Draft a file edit</b><span>Selected examples + v7 → candidate v8 + diff</span></li><li><p class="dg-tag">App / CI</p><b>Run both versions</b><span>Native SDK + same saved cases; prevent live writes</span></li><li><p class="dg-tag">App → service</p><b>Report evidence</b><span>Grades, failures, missing cases, known costs</span></li><li><p class="dg-tag">Reviewer + service</p><b>Promote v8</b><span>Approve a recorded channel update.</span></li></ol>
<div class="dg-gate"><b>Future jobs can resolve v8</b><span>The application decides when to refresh. Acclimate doesn't deploy the app or replace its native agent runtime.</span></div>
<p class="dg-footnote">Reports are application-supplied evidence, not an independent certification of remote execution.</p></figure>
