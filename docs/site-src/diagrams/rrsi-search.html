<div class="dg-input"><b>Incumbent = currently accepted harness</b><span>Its traces and the search history inform the next proposal.</span></div>

<ol class="dg-flow"><li><b>Propose edits</b><span>Candidate worktrees; bounded edit scope</span></li><li><b>Screen</b><span>Leakage critic + smoke checks</span></li><li><b>Evaluate</b><span>Measure score, cost, and guards</span></li></ol>
<div class="dg-bridge">Selection rule ↓</div>
<div class="dg-outcomes"><div><b>Candidate passes</b><span>Choose the winner as the next incumbent.</span></div><div><b>No candidate passes</b><span>Keep the previous incumbent.</span></div></div>
