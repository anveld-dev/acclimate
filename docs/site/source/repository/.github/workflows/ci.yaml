name: checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL test binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          /usr/lib/postgresql/16/bin/initdb --version
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Test built console entrypoints
        run: npx --no-install tsx --tsconfig apps/console/tsconfig.json --test apps/console/tests/console-entrypoints.integration.ts
      - run: npm run pack:verify -- --skip-build --console-runtime
      - run: npm run test:improvement
      - run: npm run test:operator
      - run: npm run test:evaluator
      - run: npm run test:full-roadmap
      - run: npm audit --audit-level=high
      - run: PYTHONPATH=python python -m unittest discover -s python/tests -v
      - run: python -m unittest discover -s scripts/operations -p 'test_*.py' -v
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: python scripts/productization/rust_tests.py --pg-bin /usr/lib/postgresql/16/bin
      - run: cargo build
      - name: Qualify connected learning against PostgreSQL
        run: python scripts/productization/connected_learning.py --skip-build --pg-bin /usr/lib/postgresql/16/bin
      - run: npm run test:e2e -- --skip-build --pg-bin /usr/lib/postgresql/16/bin
      - run: npm run qualify:full-roadmap -- --skip-build --pg-bin /usr/lib/postgresql/16/bin
      - run: python scripts/check_docs.py
      - run: python -m unittest discover -s scripts/productization -p 'test_external.py' -v
      - run: npm run test:identity:contracts
      - uses: actions/upload-artifact@v4
        with:
          name: installable-local-release
          path: |
            artifacts/releases/
            artifacts/production-only/
          if-no-files-found: error
  behaviors:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL test binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          /usr/lib/postgresql/16/bin/initdb --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bdd/requirements.txt
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r scripts/bdd/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest scripts.bdd.test_editor -v
      - run: npm run test:bdd -- --pg-bin /usr/lib/postgresql/16/bin
      - run: python scripts/test_console_browser.py --pg-bin /usr/lib/postgresql/16/bin > artifacts/bdd/console-readonly.log
      - run: python scripts/testing/console_protocol.py --pg-bin /usr/lib/postgresql/16/bin --report artifacts/production-only/console-protocol.json
      - run: npm run test:bdd -- --skip-build --dev-console --pg-bin /usr/lib/postgresql/16/bin --tags @UI-DRAFT-02
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior-results
          path: |
            artifacts/bdd/
            artifacts/bdd-dev/
            artifacts/production-only/
  keycloak:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL test binaries
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          /usr/lib/postgresql/16/bin/initdb --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/bdd/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r scripts/bdd/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: cargo build --locked
      - run: npm run build
      - run: npm run build:theme
      - run: npm run test:email -- --pg-bin /usr/lib/postgresql/16/bin --report artifacts/keycloak/email-protocol.json
      - run: python scripts/testing/member_live_updates.py --pg-bin /usr/lib/postgresql/16/bin --report artifacts/keycloak/members-auto.json
      - run: python scripts/testing/fetch_keycloak.py --output /tmp/acclimate-keycloak-tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run test:identity:keycloak -- --email --keycloak-home /tmp/acclimate-keycloak-tools/keycloak-26.8.2 --java-home "$JAVA_HOME" --pg-bin /usr/lib/postgresql/16/bin --report artifacts/keycloak/real-protocol.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keycloak-results
          path: |
            artifacts/keycloak/
            /tmp/acclimate-keycloak-tools/verified-release.json
