  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "LearningPowerProjection": {
        "type": "object",
        "properties": {
          "caseCount": {
            "type": "integer",
            "minimum": 0
          },
          "effectiveRepetitions": {
            "type": "number"
          },
          "projectedMde": {
            "type": [
              "number",
              "null"
            ]
          },
          "powerAtEffect": {
            "type": [
              "number",
              "null"
            ],
            "minimum": 0,
            "maximum": 1
          },
          "effect": {
            "type": "number"
          },
          "casesNeededAtTarget": {
            "type": [
              "integer",
              "null"
            ],
            "minimum": 0
          },
          "pairedTrials": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "caseCount",
          "effectiveRepetitions",
          "projectedMde",
          "powerAtEffect",
          "effect",
          "casesNeededAtTarget",
          "pairedTrials"
        ]
      },
      "LearningEnrollmentInspection": {
        "type": "object",
        "required": [
          "deliveredVersionId",
          "deliveredRevision",
          "developmentIncumbent",
          "rounds"
        ],
        "properties": {
          "noiseCalibration": {
            "type": "object",
            "required": [
              "requestId",
              "status"
            ],
            "properties": {
              "requestId": {
                "type": [
                  "string",
                  "null"
                ],
                "format": "uuid"
              },
              "status": {
                "description": "Evaluated means the comparison was submitted and the worker decision is pending. Completed includes calibration statistics, the repetition plan and power projections. A power guard rejection publishes those fields with stopped and stoppedReason.",
                "enum": [
                  "queued",
