[package]
name = "acclimate-executor"
version = "0.1.0"
edition = "2024"

[dependencies]
acclimate-provider-address = { path = "provider-address" }
axum = "0.8"
chrono = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "process", "sync", "signal"] }
uuid = { version = "1", features = ["v4","serde"] }
tempfile = "3"
