[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "acclimate-sdk"
version = "0.1.0"
description = "Thin Python client for Acclimate R0"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["acclimate"]

[tool.setuptools.package-data]
acclimate = ["py.typed"]
