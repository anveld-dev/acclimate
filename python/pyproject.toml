[build-system]
# flit_core builds the wheel without writing build/ or *.egg-info into the checkout.
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "acclimate-sdk"
version = "0.2.0"
description = "Python SDK for delivering versioned agent instructions, skills and memory."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["agents", "evaluation", "prompts", "llm", "release-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://acclimate.anveld.dev"
Documentation = "https://acclimate.anveld.dev/docs/reference/python-sdk"
Source = "https://github.com/anveld-dev/acclimate/tree/main/python"
Changelog = "https://github.com/anveld-dev/acclimate/blob/main/CHANGELOG.md"
Issues = "https://github.com/anveld-dev/acclimate/issues"

[tool.flit.module]
name = "acclimate"

[tool.flit.sdist]
include = ["tests/"]
exclude = ["**/__pycache__"]
